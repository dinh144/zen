[project]
name = "zen-api"
version = "0.1.0"
description = "zen's server, the only write path for every client."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pyjwt[crypto]>=2.9",
  "pillow>=11.0",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
  "ruff>=0.7",
  "pyright>=1.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["app", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run: the SQLAlchemy engine is created once, at import time, and
# an asyncpg connection can't cross event loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
