# JDK 27 (this machine's default) is newer than Gradle 9.7.1 can run on — the supported range
# is JDK 17-26 (https://docs.gradle.org/current/userguide/compatibility.html). Point JAVA_HOME
# at a JDK 17-26 before invoking ./gradlew; module build.gradle.kts files also set a JDK 17
# toolchain for compilation, which Gradle auto-detects from an already-installed JDK.
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
