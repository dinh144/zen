<!doctype html>
<meta charset="utf-8" />
<style>
  body { width: 280px; margin: 0; padding: 12px; font: 13px/1.4 system-ui; background: #F4F1EA; color: #1A1A18; }
  textarea, input { width: 100%; box-sizing: border-box; background: #FBF9F4; color: #1A1A18; border: 1px solid #DED7C8; border-radius: 2px; padding: 8px; font: inherit; }
  button { margin-top: 8px; width: 100%; background: #1A1A18; color: #F4F1EA; border: 0; border-radius: 2px; padding: 8px; font: inherit; cursor: pointer; }
  a { color: #6F6A5F; font-size: 11px; }
  #signedOut, #signedIn, #unreachable { display: none; }
  #signedOut a { display: inline-block; margin-top: 4px; color: #1A1A18; }
</style>
<div id="unreachable">
  <p>can't reach zen — check the address below</p>
</div>
<div id="signedOut">
  <p>sign in to zen to save from here</p>
  <a id="signInLink" href="#" target="_blank" rel="noopener">sign in to zen</a>
</div>
<div id="signedIn">
  <textarea id="note" rows="3" placeholder="A thought about this page…"></textarea>
  <button id="save">Save page to zen</button>
</div>
<p><input id="endpoint" placeholder="http://localhost:3000" /></p>
<script src="popup.js"></script>
