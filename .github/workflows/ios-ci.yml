name: ios-ci
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test scripts/generate-ios-strings.test.ts
      - run: bun scripts/generate-ios-strings.ts
      - run: command -v xcodegen || brew install xcodegen
      - run: cd apps/ios && xcodegen generate
      - name: Swift Testing unit tests (ZenAPIClient)
        run: cd apps/ios/ZenAPIClient && swift test
      - name: Build for the simulator
        run: |
          cd apps/ios
          xcodebuild build \
            -project Zen.xcodeproj -scheme Zen \
            -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 17" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Install the app on a booted simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime, ds in devices.items():
              for d in ds:
                  if d["name"] == "iPhone 17":
                      print(d["udid"]); sys.exit(0)
          sys.exit(1)')
          xcrun simctl boot "$UDID" || true
          APP_PATH=$(find apps/ios -name "Zen.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP_PATH"
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Run the shared Maestro smoke flow
        run: |
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --device "$SIMULATOR_UDID" test -e APP_ID=com.dinh144.zen flows/smoke.yaml
