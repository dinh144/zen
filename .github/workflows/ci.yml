name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Pages are force-dynamic, so the build never connects; the client only needs a URL to parse.
      DATABASE_URL: postgres://zen:zen@localhost:5434/zen
      OASDIFF_VERSION: 1.32.1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd apps/web && bun run openapi && git diff --exit-code openapi.json
      - run: git fetch --depth=1 origin main:refs/remotes/origin/main
      - uses: actions/cache@v4
        with:
          path: ~/.local/bin/oasdiff
          key: oasdiff-${{ env.OASDIFF_VERSION }}
      - run: |
          test -x "$HOME/.local/bin/oasdiff" || curl -fsSL https://raw.githubusercontent.com/oasdiff/oasdiff/main/install.sh | INSTALL_DIR="$HOME/.local/bin" version="$OASDIFF_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: |
          cd apps/web
          if git cat-file -e origin/main:apps/web/openapi.json 2>/dev/null; then
            git show origin/main:apps/web/openapi.json > /tmp/base-openapi.json
            oasdiff breaking /tmp/base-openapi.json openapi.json --fail-on ERR
          else
            echo "main has no committed openapi.json yet — nothing to diff"
          fi
      - run: bun run typecheck
      - run: bun run lint
      - run: cd apps/web && bun run test
      - run: bun run build
